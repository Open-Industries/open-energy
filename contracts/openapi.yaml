openapi: 3.1.0
info:
  title: Open Energy — Reference Energy Core Platform — aggregate contract
  version: 1.0.0
  description: >
    Aggregate view of the platform's public REST contracts. The normative per-service
    contracts are generated from code by Quarkus SmallRye OpenAPI at `/openapi` on each
    service; CI diffs them against this file (see docs/api/api-standards.md).
    Conventions: RFC 9457 errors, Idempotency-Key on creates, lifecycle transitions
    take no body, explicit units on every quantity, all data synthetic.
servers:
  - url: https://api.example.org/api/v1
    description: Production (per adopter)
security:
  - bearerAuth: []
paths:
  /grid-assets:
    post:
      operationId: create-asset
      summary: "Registry of grid assets (CIM concept-level shapes)."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /dispatch:
    post:
      operationId: create-dispatch
      summary: "Guarded dispatch capacity per asset and the dispatch orders against it."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /grid-rules:
    post:
      operationId: create-grid
      summary: "Decision rules binding zone types to load and outage envelopes."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /meters:
    post:
      operationId: create-meter
      summary: "Metering point catalogue."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /notifications:
    post:
      operationId: dispatch-notification
      summary: Dispatch a notification
      responses:
        '202': { description: Accepted }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
